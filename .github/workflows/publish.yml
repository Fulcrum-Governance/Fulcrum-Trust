name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          pyproject = pathlib.Path("pyproject.toml")
          project_version = tomllib.loads(pyproject.read_text())["project"]["version"]

          tag_name = os.environ.get("GITHUB_REF_NAME", "")
          normalized_tag = tag_name[1:] if tag_name.startswith("v") else tag_name

          if normalized_tag != project_version:
              print(
                  f"Tag/version mismatch: tag='{tag_name}' vs pyproject='{project_version}'. "
                  "Update pyproject.toml or retag before publishing.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(f"Tag/version check passed: {tag_name} -> {project_version}")
          PY

      - name: Install build
        run: pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fulcrum-trust
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Snapshot existing TestPyPI files
        run: |
          curl -sf https://test.pypi.org/pypi/fulcrum-trust/json -o /tmp/testpypi.json \
            || echo '{}' > /tmp/testpypi.json
          python - <<'PY'
          import json
          import pathlib

          data = json.loads(pathlib.Path("/tmp/testpypi.json").read_text() or "{}")
          existing = sorted(
              f["filename"]
              for files in data.get("releases", {}).values()
              for f in files
          )
          pathlib.Path("/tmp/existing-before.json").write_text(json.dumps(existing))
          print(f"TestPyPI currently holds {len(existing)} file(s)")
          PY

      # skip-existing keeps the verification dispatch repeatable: re-running the same
      # version must not red on duplicate-file, because that failure is visually
      # indistinguishable from a broken publisher registration. It cannot mask the thing
      # under test — OIDC auth resolves before upload, so invalid-publisher still fails
      # red. TestPyPI only; the prod job keeps strict duplicate semantics.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Report upload result
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          before = set(json.loads(pathlib.Path("/tmp/existing-before.json").read_text()))
          built = sorted(p.name for p in pathlib.Path("dist").iterdir() if p.is_file())
          skipped = [f for f in built if f in before]
          uploaded = [f for f in built if f not in before]

          lines = [
              "## TestPyPI publish result",
              "",
              f"- uploaded: **{len(uploaded)}**",
              f"- skipped as already-existing: **{len(skipped)}**",
          ]
          if uploaded:
              lines += ["", "Uploaded:"] + [f"- `{f}`" for f in uploaded]
          if skipped:
              lines += ["", "Skipped as already-existing:"] + [f"- `{f}`" for f in skipped]
          if not uploaded:
              lines += [
                  "",
                  "> **Green, but nothing was uploaded** — every built file already existed "
                  "on TestPyPI. Trusted publishing still authenticated: OIDC resolves before "
                  "upload, so `invalid-publisher` would have failed this job red regardless. "
                  "The registration is valid.",
              ]

          out = "\n".join(lines)
          print(out)
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(out + "\n")
          PY

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    # Tag pushes only — a manual verification dispatch can never reach prod PyPI.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fulcrum-trust
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
